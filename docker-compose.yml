# Local environment: the Cart API with PostgreSQL, Redis and the Azure Service Bus emulator.
# The passwords below are for local containers only. Real environments get secrets from Azure Key Vault.
name: cartservice

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cartservice
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cartservice"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The cache. Nothing is stored on disk, so Redis starts empty. The API works without it: stop it with
  # "docker compose stop redis" and the API reads every cart from PostgreSQL.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The Service Bus emulator keeps its metadata in a SQL Server, which it needs as a dependency.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Cart-local-only-1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The topic "cart-events" and its subscription "order-service" come from the file that the tests use as well.
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "Cart-local-only-1"
    volumes:
      - ./infra/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started
      # Started first, but the API does not wait for it to be healthy: the cache is optional.
      redis:
        condition: service_started
    environment:
      # Development enables the token endpoint and the local signing key. Production refuses both and needs
      # Authentication__Authority (Microsoft Entra External ID) and ServiceBus__FullyQualifiedNamespace instead.
      ASPNETCORE_ENVIRONMENT: Development
      # "GSS Encryption Mode=Disable" stops Npgsql from probing for Kerberos, which the slim runtime image lacks.
      Database__ConnectionString: "Host=postgres;Database=cartservice;Username=cart;Password=cart-local-only;GSS Encryption Mode=Disable"
      Database__ApplyMigrationsOnStartup: "true"
      Cache__ConnectionString: "redis:6379"
      ServiceBus__ConnectionString: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
